name: vectorgallery_mobile
description: "VectorGallery — Personal AI Cloud & Digital Memory Mobile Application"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.3+1
  crypto: ^3.0.3
  sqflite: ^2.3.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

