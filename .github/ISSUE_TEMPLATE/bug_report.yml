name: Bug Report
description: Report an issue in VectorGallery web or mobile
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Clear summary of what happened vs expected behavior.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Platform
      options:
        - Web (Next.js)
        - Mobile (Flutter)
        - API / Worker
        - Database / Supabase
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Navigate to...
        2. Run...
        3. Observe error...

