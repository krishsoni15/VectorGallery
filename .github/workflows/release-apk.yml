name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Default API base URL baked into the APK (optional)'
        required: false
        default: ''

jobs:
  build-android:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run static analysis and tests
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Build Android APK
        working-directory: mobile
        run: |
          if [ -n "${{ github.event.inputs.api_url }}" ]; then
            flutter build apk --release --dart-define=VECTORGALLERY_API_URL=${{ github.event.inputs.api_url }}
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vectorgallery-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

